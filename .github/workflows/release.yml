name: release-cli

on:
  push:
    tags: ["cli-v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'hamster-switch/server-integrations'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - name: Build Linux CLI
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/hamster-integrations-linux-amd64 ./cmd/hamster-integrations
          tar -C dist -czf dist/hamster-integrations-linux-amd64.tar.gz hamster-integrations-linux-amd64
          sha256sum dist/hamster-integrations-linux-amd64.tar.gz > dist/SHA256SUMS
      - name: Publish immutable formal Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/hamster-integrations-linux-amd64.tar.gz \
            dist/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
