name: release-image

on:
  workflow_dispatch:
    inputs:
      component:
        description: Component
        required: true
        type: choice
        options: [sub2api, new-api]
      version:
        description: Patch version without v prefix
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.repository == 'hamster-switch/server-integrations'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build hamster-integrations CLI
        run: go build -trimpath -o /tmp/hamint ./cmd/hamster-integrations
      - name: Resolve upstream repository and commit
        id: upstream
        run: |
          python3 - <<'PY'
          import json, os
          comp = os.environ['COMPONENT']
          ver = os.environ['VERSION']
          d = json.load(open(f'releases/{comp}/{ver}/manifest.template.json'))
          up = d['upstream']
          print('repo=' + up['repository'])
          print('commit=' + up['commit'])
          PY
        env:
          COMPONENT: ${{ inputs.component }}
          VERSION: ${{ inputs.version }}
      - name: Clone upstream at pinned commit and apply signed patch
        run: |
          set -eu
          REPO=$(python3 -c "import json;d=json.load(open('releases/${{ inputs.component }}/${{ inputs.version }}/manifest.template.json'));print(d['upstream']['repository'])")
          COMMIT=$(python3 -c "import json;d=json.load(open('releases/${{ inputs.component }}/${{ inputs.version }}/manifest.template.json'));print(d['upstream']['commit'])")
          git clone "$REPO" /tmp/upstream
          git -C /tmp/upstream checkout "$COMMIT"
          /tmp/hamint update ${{ inputs.component }} --target /tmp/upstream --mode manual --yes
      - name: Build and push image to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPONENT: ${{ inputs.component }}
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          IMAGE="ghcr.io/hamster-switch/${COMPONENT}:${VERSION}"
          docker build -t "$IMAGE" /tmp/upstream
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE"
          echo "PUSHED=$IMAGE" >> "$GITHUB_STEP_SUMMARY"
