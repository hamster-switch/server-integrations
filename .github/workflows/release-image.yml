name: release-image

on:
  workflow_dispatch:
    inputs:
      component:
        description: Component
        required: true
        type: choice
        options: [sub2api, new-api]
      channel:
        description: Release channel
        required: true
        default: default
        type: choice
        options: [default, hamster]
      version:
        description: Patch version without v prefix
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    if: github.repository == 'hamster-switch/server-integrations'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build hamster-integrations CLI
        run: go build -trimpath -o /tmp/hamint ./cmd/hamster-integrations
      - name: Resolve release channel
        env:
          COMPONENT: ${{ inputs.component }}
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          case "$CHANNEL" in
            default)
              RELEASE_DIR="releases/${COMPONENT}/${VERSION}"
              RELEASE_NAME="$COMPONENT"
              SOURCE_TAG="${COMPONENT}-v${VERSION}"
              IMAGE_TAG="hs-v${VERSION}"
              INSTALLER_CHANNEL=""
              ;;
            hamster)
              RELEASE_DIR="releases/${COMPONENT}/${CHANNEL}/${VERSION}"
              RELEASE_NAME="${COMPONENT}-${CHANNEL}"
              SOURCE_TAG="${RELEASE_NAME}-v${VERSION}"
              IMAGE_TAG="${CHANNEL}-v${VERSION}"
              INSTALLER_CHANNEL="$CHANNEL"
              ;;
            *)
              echo "Unsupported release channel: $CHANNEL" >&2
              exit 1
              ;;
          esac
          case "$COMPONENT" in
            sub2api)
              CONTAINER_BINARY="/app/sub2api"
              DEFAULT_PORT="8080"
              PORT_ENV_NAME="SERVER_PORT"
              HEALTH_PATH="/health"
              REQUIRE_HTTP_HEALTH="0"
              ;;
            new-api)
              CONTAINER_BINARY="/new-api"
              DEFAULT_PORT="3000"
              PORT_ENV_NAME="PORT"
              HEALTH_PATH="/api/status"
              REQUIRE_HTTP_HEALTH="1"
              ;;
            *)
              echo "Unsupported component: $COMPONENT" >&2
              exit 1
              ;;
          esac
          test -f "${RELEASE_DIR}/manifest.template.json"
          echo "RELEASE_DIR=${RELEASE_DIR}" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=${RELEASE_NAME}" >> "$GITHUB_ENV"
          echo "SOURCE_TAG=${SOURCE_TAG}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "INSTALLER_CHANNEL=${INSTALLER_CHANNEL}" >> "$GITHUB_ENV"
          echo "CONTAINER_BINARY=${CONTAINER_BINARY}" >> "$GITHUB_ENV"
          echo "DEFAULT_PORT=${DEFAULT_PORT}" >> "$GITHUB_ENV"
          echo "PORT_ENV_NAME=${PORT_ENV_NAME}" >> "$GITHUB_ENV"
          echo "HEALTH_PATH=${HEALTH_PATH}" >> "$GITHUB_ENV"
          echo "REQUIRE_HTTP_HEALTH=${REQUIRE_HTTP_HEALTH}" >> "$GITHUB_ENV"
      - name: Clone upstream at pinned commit and apply signed patch
        env:
          HAMSTER_INTEGRATIONS_STATE_DIR: /tmp/hamster-int-state
        run: |
          set -eu
          mkdir -p /tmp/hamster-int-state
          REPO=$(python3 -c "import json;d=json.load(open('${RELEASE_DIR}/manifest.template.json'));print(d['upstream']['repository'])")
          COMMIT=$(python3 -c "import json;d=json.load(open('${RELEASE_DIR}/manifest.template.json'));print(d['upstream']['commit'])")
          git clone "$REPO" /tmp/upstream
          git -C /tmp/upstream checkout "$COMMIT"
          /tmp/hamint update ${{ inputs.component }} \
            --target /tmp/upstream \
            --release "$SOURCE_TAG" \
            --mode manual \
            --yes
      - name: Build image, systemd binary, and verified installer assets
        env:
          COMPONENT: ${{ inputs.component }}
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          IMAGE="hamster-switch/${COMPONENT}:${IMAGE_TAG}"
          ASSET="${RELEASE_NAME}-image-v${VERSION}.tar.gz"
          BINARY_ASSET="${RELEASE_NAME}-linux-amd64-v${VERSION}.gz"
          INSTALLER="install-${RELEASE_NAME}-v${VERSION}.sh"
          docker build --platform linux/amd64 \
            --build-arg BUN_REGISTRY=https://registry.npmjs.org \
            --build-arg GOPROXY=https://proxy.golang.org,direct \
            --build-arg GOSUMDB=sum.golang.org \
            -t "$IMAGE" /tmp/upstream
          docker save "$IMAGE" | gzip > "/tmp/${ASSET}"
          CONTAINER_ID="$(docker create --platform linux/amd64 "$IMAGE")"
          trap 'docker rm -f "$CONTAINER_ID" >/dev/null 2>&1 || true' EXIT
          docker cp "${CONTAINER_ID}:${CONTAINER_BINARY}" "/tmp/${COMPONENT}-linux-amd64"
          docker rm "$CONTAINER_ID" >/dev/null
          trap - EXIT
          file "/tmp/${COMPONENT}-linux-amd64" | grep -Eq 'ELF 64-bit.*x86-64'
          gzip -n -9 -c "/tmp/${COMPONENT}-linux-amd64" > "/tmp/${BINARY_ASSET}"
          sed \
            -e "s/__COMPONENT__/${COMPONENT}/g" \
            -e "s/__CHANNEL__/${INSTALLER_CHANNEL}/g" \
            -e "s/__VERSION__/${VERSION}/g" \
            -e "s/__DEFAULT_PORT__/${DEFAULT_PORT}/g" \
            -e "s/__PORT_ENV_NAME__/${PORT_ENV_NAME}/g" \
            -e "s#__HEALTH_PATH__#${HEALTH_PATH}#g" \
            -e "s/__REQUIRE_HTTP_HEALTH__/${REQUIRE_HTTP_HEALTH}/g" \
            scripts/install-prebuilt-image.sh > "/tmp/${INSTALLER}"
          chmod 0755 "/tmp/${INSTALLER}"
          (
            cd /tmp
            sha256sum "$ASSET" "$BINARY_ASSET" "$INSTALLER" > SHA256SUMS
          )
      - name: Publish immutable public image Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPONENT: ${{ inputs.component }}
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          ASSET="${RELEASE_NAME}-image-v${VERSION}.tar.gz"
          BINARY_ASSET="${RELEASE_NAME}-linux-amd64-v${VERSION}.gz"
          INSTALLER="install-${RELEASE_NAME}-v${VERSION}.sh"
          TAG="image-${RELEASE_NAME}-v${VERSION}"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; published assets are immutable." >&2
            exit 1
          fi
          gh release create "$TAG" \
            "/tmp/${ASSET}" \
            "/tmp/${BINARY_ASSET}" \
            "/tmp/${INSTALLER}" \
            /tmp/SHA256SUMS \
            --title "$TAG" \
            --notes "Prebuilt patched image, Linux amd64 systemd binary, and verified installer for ${RELEASE_NAME} v${VERSION}" \
            -R "$GITHUB_REPOSITORY"
          echo "ASSET_URL=https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$ASSET" >> "$GITHUB_STEP_SUMMARY"
