name: ci

on:
  workflow_dispatch:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/hamster-integrations
      - run: bash scripts/test-install-prebuilt-image.sh
      - run: GOOS=linux GOARCH=amd64 go build -trimpath -o dist/hamster-integrations-linux-amd64 ./cmd/hamster-integrations
      - name: Verify configured signing key matches embedded trust root
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          HAMSTER_INTEGRATIONS_ED25519_PRIVATE_KEY: ${{ secrets.HAMSTER_INTEGRATIONS_ED25519_PRIVATE_KEY }}
        run: |
          test -n "$HAMSTER_INTEGRATIONS_ED25519_PRIVATE_KEY"
          go run ./cmd/release-builder \
            --manifest testdata/signing-smoke/manifest.template.json \
            --assets testdata/signing-smoke/assets \
            --output dist/signing-smoke
