name: release-signed-patch

on:
  push:
    tags:
      - 'sub2api-v*.*.*'
      - 'new-api-v*.*.*'
  workflow_dispatch:
    inputs:
      component:
        description: Component
        required: true
        type: choice
        options: [sub2api, new-api]
      version:
        description: Patch version without v prefix
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'hamster-switch/server-integrations' && (github.event_name == 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - name: Resolve immutable component release
        env:
          DISPATCH_COMPONENT: ${{ inputs.component }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            case "$GITHUB_REF_NAME" in
              sub2api-v*) COMPONENT="sub2api"; VERSION="${GITHUB_REF_NAME#sub2api-v}" ;;
              new-api-v*) COMPONENT="new-api"; VERSION="${GITHUB_REF_NAME#new-api-v}" ;;
              *) echo "unsupported release tag: $GITHUB_REF_NAME" >&2; exit 1 ;;
            esac
          else
            COMPONENT="$DISPATCH_COMPONENT"
            VERSION="$DISPATCH_VERSION"
          fi
          printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          test "$GITHUB_REF_NAME" = "${COMPONENT}-v${VERSION}" || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]
          echo "COMPONENT=$COMPONENT" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build and sign exact release manifest
        env:
          HAMSTER_INTEGRATIONS_ED25519_PRIVATE_KEY: ${{ secrets.HAMSTER_INTEGRATIONS_ED25519_PRIVATE_KEY }}
        run: |
          test -n "$HAMSTER_INTEGRATIONS_ED25519_PRIVATE_KEY"
          printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          test -f "releases/${COMPONENT}/${VERSION}/manifest.template.json"
          test -d "releases/${COMPONENT}/${VERSION}/assets"
          mkdir -p dist/release
          go run ./cmd/release-builder \
            --manifest "releases/${COMPONENT}/${VERSION}/manifest.template.json" \
            --assets "releases/${COMPONENT}/${VERSION}/assets" \
            --output dist/release
          cp "releases/${COMPONENT}/${VERSION}/assets/"* dist/release/
      - name: Publish immutable formal Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${COMPONENT}-v${VERSION}"
          git rev-parse "$TAG" >/dev/null 2>&1 || {
            echo "An annotated, pushed tag $TAG is required" >&2
            exit 1
          }
          gh release create "$TAG" dist/release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag
