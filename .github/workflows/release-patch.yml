name: release-signed-patch

on:
  workflow_dispatch:
    inputs:
      component:
        description: Component
        required: true
        type: choice
        options: [sub2api, new-api]
      channel:
        description: Release channel
        required: true
        default: default
        type: choice
        options: [default, hamster]
      version:
        description: Patch version without v prefix
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.repository == 'hamster-switch/server-integrations'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - name: Resolve release channel
        env:
          COMPONENT: ${{ inputs.component }}
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          case "$CHANNEL" in
            default)
              RELEASE_DIR="releases/${COMPONENT}/${VERSION}"
              RELEASE_TAG="${COMPONENT}-v${VERSION}"
              EXPECTED_CHANNEL=""
              ;;
            hamster)
              RELEASE_DIR="releases/${COMPONENT}/${CHANNEL}/${VERSION}"
              RELEASE_TAG="${COMPONENT}-${CHANNEL}-v${VERSION}"
              EXPECTED_CHANNEL="$CHANNEL"
              ;;
            *)
              echo "Unsupported release channel: $CHANNEL" >&2
              exit 1
              ;;
          esac
          printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          test -f "${RELEASE_DIR}/manifest.template.json"
          test -d "${RELEASE_DIR}/assets"
          python3 - "$RELEASE_DIR/manifest.template.json" "$EXPECTED_CHANNEL" "$RELEASE_TAG" <<'PY'
          import json
          import sys

          path, expected_channel, expected_tag = sys.argv[1:]
          with open(path, encoding="utf-8") as source:
              manifest = json.load(source)
          if manifest.get("channel", "") != expected_channel:
              raise SystemExit("manifest channel does not match workflow input")
          if manifest.get("release_id") != expected_tag:
              raise SystemExit("manifest release_id does not match resolved tag")
          PY
          echo "RELEASE_DIR=${RELEASE_DIR}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
      - name: Build and sign exact release manifest
        env:
          HAMSTER_INTEGRATIONS_ED25519_PRIVATE_KEY: ${{ secrets.HAMSTER_INTEGRATIONS_ED25519_PRIVATE_KEY }}
        run: |
          test -n "$HAMSTER_INTEGRATIONS_ED25519_PRIVATE_KEY"
          mkdir -p dist/release
          go run ./cmd/release-builder \
            --manifest "${RELEASE_DIR}/manifest.template.json" \
            --assets "${RELEASE_DIR}/assets" \
            --output dist/release
          cp "${RELEASE_DIR}/assets/"* dist/release/
      - name: Publish immutable formal Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git rev-parse "$RELEASE_TAG" >/dev/null 2>&1 || {
            echo "An annotated, pushed tag $RELEASE_TAG is required" >&2
            exit 1
          }
          gh release create "$RELEASE_TAG" dist/release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --verify-tag
